<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            background-color: rgb(183, 201, 202);
            width: 800px ;
            height: 200px;
            position: relative;
        }
        .parent .textform{
            background-color: white;
            width: 400px;
            height: 80px;
            border-radius: 10px;
            position: absolute;
            margin-left: 35%;
            display: none;

        }
        p{
            line-height: 45px;
            margin-left: 15px;
        }
        .close-btn{
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 25px;
            cursor: pointer;
            user-select: none;

        }
        
    </style>
</head>
<body>
    <div class="parent">
       <h1>Modal Example</h1>
       <button onclick="showText()">Open Modal</button>
       <div class="textform">
         <p>Some text in the Modal.</p>
         <span class="close-btn" onclick="hideText()">&times;</span>
       </div>
    </div>
    <script>
        let closeButton = document.getElementsByClassName("close-btn")[0];
        let textForm = document.getElementsByClassName("textform")[0];
        let parent = document.getElementsByClassName("parent")[0]; 
        
        function showText() {
           textForm.style.display ="block";
           parent.style.backgroundColor = "grey";
           
        
        }

        function hideText() {
            textForm.style.display ="none";
            parent.style.backgroundColor = "rgb(183, 201, 202)";
        }


    </script>
</body>
</html>
